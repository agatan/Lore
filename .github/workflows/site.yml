name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "worker/**"
      - "wrangler.jsonc"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "worker/**"
      - "wrangler.jsonc"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # fork からの PR には secrets が渡らないため、同じ repository のブランチだけを対象にする。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to production
        if: github.event_name != 'pull_request'
        run: npx --yes wrangler@4 deploy

      - name: Upload a preview version
        if: github.event_name == 'pull_request'
        run: |
          npx --yes wrangler@4 versions upload \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}" \
            | tee upload.log
          url="$(grep -oE 'https://pr-[^ ]+\.workers\.dev' upload.log | head -n1 || true)"
          echo "Preview: ${url:-see the log above}" >> "$GITHUB_STEP_SUMMARY"
